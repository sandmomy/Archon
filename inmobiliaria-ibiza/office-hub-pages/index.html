<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Inmobiliaria Ibiza · Office Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b1220;
    --panel: rgba(14, 20, 34, 0.82);
    --panel-solid: #121a2b;
    --line: rgba(255,255,255,0.08);
    --text: #f4f7fb;
    --muted: #9aa8bd;
    --purple: #8b5cf6;
    --yellow: #eab308;
    --green: #22c55e;
    --blue: #3b82f6;
    --red: #ef4444;
    --orange: #f97316;
    --ok: #22c55e;
    --needs: #ef4444;
    --idle: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Figtree", system-ui, sans-serif;
  }
  button { font: inherit; color: inherit; }

  .app {
    min-height: 100dvh;
    display: grid;
    grid-template-columns: 236px 1fr;
    grid-template-rows: 64px 1fr;
    grid-template-areas:
      "side head"
      "side stage";
  }

  /* —— Sidebar —— */
  .side {
    grid-area: side;
    background: linear-gradient(180deg, #101827 0%, #0c1322 100%);
    border-right: 1px solid var(--line);
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    z-index: 5;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 6px 10px;
  }
  .brand-mark {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 50% 60%, #1f6b4a 0 28%, transparent 29%),
      radial-gradient(circle at 50% 40%, #f0c36a 0 18%, transparent 19%),
      linear-gradient(145deg, #1d4d3a, #0e2a22);
    border: 1px solid rgba(255,255,255,0.12);
    position: relative;
    flex: 0 0 auto;
  }
  .brand-mark::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 28%;
    width: 10px;
    height: 16px;
    transform: translateX(-50%);
    background: #2f8f5b;
    border-radius: 40% 40% 20% 20%;
    box-shadow: 6px 4px 0 -2px #247a4c, -6px 4px 0 -2px #247a4c;
  }
  .brand strong {
    display: block;
    font-family: "Outfit", sans-serif;
    font-size: 0.92rem;
    line-height: 1.15;
    letter-spacing: -0.01em;
  }
  .brand span {
    display: block;
    color: var(--muted);
    font-size: 0.72rem;
    margin-top: 2px;
  }
  .nav {
    display: grid;
    gap: 4px;
  }
  .nav a {
    display: flex;
    align-items: center;
    gap: 10px;
    text-decoration: none;
    color: var(--muted);
    padding: 10px 12px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.92rem;
    transition: background .18s, color .18s;
  }
  .nav a:hover, .nav a.active {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }
  .nav svg { width: 18px; height: 18px; opacity: 0.9; flex: 0 0 auto; }
  .badge {
    margin-left: auto;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: #e11d48;
    color: #fff;
    font-size: 0.72rem;
    font-weight: 700;
    display: grid;
    place-items: center;
  }

  /* —— Header —— */
  .head {
    grid-area: head;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    background: rgba(10, 16, 28, 0.75);
    backdrop-filter: blur(10px);
    z-index: 4;
  }
  .head h1 {
    margin: 0;
    font-family: "Outfit", sans-serif;
    font-size: 1.05rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .head-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(34,197,94,0.12);
    border: 1px solid rgba(34,197,94,0.28);
    color: #86efac;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .pill i {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 4px rgba(34,197,94,0.18);
    animation: blink 2s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.45; }
  }
  .avatars { display: flex; }
  .avatars span {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 2px solid #0b1220;
    margin-left: -8px;
    background: linear-gradient(135deg, #64748b, #334155);
  }
  .avatars span:first-child { margin-left: 0; background: linear-gradient(135deg,#f59e0b,#b45309); }
  .avatars span:nth-child(2) { background: linear-gradient(135deg,#38bdf8,#0369a1); }
  .avatars span:nth-child(3) { background: linear-gradient(135deg,#a78bfa,#6d28d9); }
  .icon-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(255,255,255,0.04);
    display: grid;
    place-items: center;
    cursor: pointer;
  }
  .icon-btn svg { width: 16px; height: 16px; }

  /* —— Stage with exact photo —— */
  .stage {
    grid-area: stage;
    position: relative;
    overflow: hidden;
    background: #05080f;
  }
  .scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
  }
  .frame {
    position: relative;
    width: min(100%, calc(100dvh * 1774 / 887));
    max-width: 100%;
    aspect-ratio: 1774 / 887;
    max-height: 100%;
  }
  .frame img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 0;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* Interactive overlays mapped on the photo */
  .hitlayer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .sector {
    fill: transparent;
    stroke: transparent;
    cursor: pointer;
    transition: fill .2s ease, stroke .2s ease, filter .2s ease;
  }
  .sector:hover,
  .sector.is-hover {
    fill: rgba(255,255,255,0.10);
    stroke: rgba(255,255,255,0.55);
    stroke-width: 2;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.35));
  }
  .sector.is-active {
    fill: rgba(255,255,255,0.16);
    stroke: #fff;
    stroke-width: 2.5;
    filter: drop-shadow(0 0 14px currentColor);
  }
  .station {
    fill: transparent;
    stroke: transparent;
    cursor: pointer;
    transition: fill .2s, stroke .2s;
  }
  .station:hover,
  .station.is-hover,
  .sector.is-hover + .station,
  .station[data-linked].is-hover {
    fill: rgba(255,255,255,0.04);
    stroke: rgba(255,255,255,0.22);
    stroke-width: 1.5;
  }

  .tooltip {
    position: absolute;
    z-index: 8;
    min-width: 200px;
    max-width: 260px;
    padding: 10px 12px;
    border-radius: 14px;
    background: rgba(255,255,255,0.96);
    color: #0f172a;
    box-shadow: 0 16px 40px rgba(0,0,0,0.35);
    pointer-events: none;
    opacity: 0;
    transform: translate(-50%, -110%) scale(0.96);
    transition: opacity .15s ease, transform .15s ease;
  }
  .tooltip.show {
    opacity: 1;
    transform: translate(-50%, -120%) scale(1);
  }
  .tooltip strong {
    display: block;
    font-family: "Outfit", sans-serif;
    font-size: 0.92rem;
    margin-bottom: 2px;
  }
  .tooltip p {
    margin: 0;
    font-size: 0.8rem;
    color: #475569;
    line-height: 1.35;
  }
  .tooltip .tag {
    display: inline-flex;
    margin-top: 8px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .tag.working { background: #dcfce7; color: #166534; }
  .tag.needs { background: #fee2e2; color: #991b1b; }
  .tag.idle { background: #e2e8f0; color: #334155; }

  .hint {
    position: absolute;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    z-index: 3;
    padding: 8px 14px;
    border-radius: 999px;
    background: rgba(8,12,22,0.72);
    border: 1px solid rgba(255,255,255,0.1);
    color: #cbd5e1;
    font-size: 0.8rem;
    backdrop-filter: blur(8px);
    white-space: nowrap;
  }

  /* Detail panel */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(2,6,14,0.45);
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
    z-index: 20;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .panel {
    position: fixed;
    top: 0;
    right: 0;
    width: min(380px, 100vw);
    height: 100dvh;
    z-index: 30;
    background: linear-gradient(180deg, #121a2b 0%, #0b1220 100%);
    border-left: 1px solid var(--line);
    box-shadow: -24px 0 60px rgba(0,0,0,0.45);
    transform: translateX(105%);
    transition: transform .4s cubic-bezier(.2,.8,.2,1);
    padding: 22px 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .panel.open { transform: translateX(0); }
  .panel-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .swatch {
    width: 14px;
    height: 14px;
    border-radius: 4px;
    display: inline-block;
    margin-right: 8px;
    vertical-align: middle;
  }
  .close {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    cursor: pointer;
    font-size: 1.3rem;
  }
  .kicker {
    color: var(--muted);
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-weight: 700;
  }
  .panel h2 {
    margin: 0;
    font-family: "Outfit", sans-serif;
    font-size: 1.7rem;
    letter-spacing: -0.02em;
  }
  .panel .sub {
    margin: 0;
    color: var(--muted);
    line-height: 1.45;
  }
  .status {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 12px;
    align-items: center;
    padding: 14px;
    border-radius: 16px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--line);
  }
  .orb {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
  }
  .orb span {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: currentColor;
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0.35;
    animation: pulse 2s ease-out infinite;
  }
  @keyframes pulse {
    from { transform: scale(0.9); opacity: 0.45; }
    to { transform: scale(1.25); opacity: 0; }
  }
  .orb.working { color: var(--ok); background: rgba(34,197,94,0.12); }
  .orb.needs { color: var(--needs); background: rgba(239,68,68,0.12); }
  .orb.idle { color: var(--idle); background: rgba(148,163,184,0.12); }
  .status strong { display: block; font-size: 1rem; }
  .status em { font-style: normal; color: var(--muted); font-size: 0.85rem; }
  .metrics { display: grid; gap: 8px; }
  .metric {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 12px;
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--line);
    font-size: 0.9rem;
  }
  .metric span { color: var(--muted); }
  .actions { margin-top: auto; display: grid; gap: 8px; }
  .btn {
    border: 0;
    border-radius: 12px;
    padding: 13px 14px;
    font-weight: 650;
    cursor: pointer;
  }
  .btn.primary {
    background: linear-gradient(135deg, #3b82f6, #1d4ed8);
    color: white;
  }
  .btn.ghost {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
  }

  /* Portrait phones */
  @media (max-width: 860px) and (orientation: portrait) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: 56px auto 1fr;
      grid-template-areas:
        "head"
        "side"
        "stage";
    }
    .side {
      flex-direction: row;
      align-items: center;
      overflow-x: auto;
      padding: 8px 10px;
      gap: 8px;
      border-right: 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { display: none; }
    .nav {
      display: flex;
      gap: 4px;
      width: 100%;
    }
    .nav a {
      white-space: nowrap;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    .nav a svg { display: none; }
    .head h1 { font-size: 0.92rem; }
    .pill span { display: none; }
    .hint { font-size: 0.72rem; bottom: 10px; max-width: 92vw; white-space: normal; text-align: center; }
    .panel {
      top: auto;
      bottom: 0;
      width: 100vw;
      height: auto;
      max-height: 78dvh;
      border-left: 0;
      border-radius: 18px 18px 0 0;
      transform: translateY(105%);
    }
    .panel.open { transform: translateY(0); }
  }

  /* Landscape phones / short height */
  @media (max-height: 520px), (orientation: landscape) and (max-width: 980px) {
    .side { padding: 10px 8px; width: auto; }
    .brand strong { font-size: 0.8rem; }
    .brand span { display: none; }
    .nav a { padding: 8px 10px; font-size: 0.8rem; }
    .head { padding: 0 12px; }
    .head h1 { font-size: 0.9rem; }
    .hint { display: none; }
    .panel { width: min(340px, 48vw); padding: 14px; }
    .panel h2 { font-size: 1.3rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="side" aria-label="Navegación">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <strong>Inmobiliaria Ibiza</strong>
          <span>Office Hub</span>
        </div>
      </div>
      <nav class="nav">
        <a class="active" href="#oficina" data-nav="oficina">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 10l8-6 8 6v9a1 1 0 01-1 1h-5v-6H10v6H5a1 1 0 01-1-1z"/></svg>
          Oficina

        <a href="#proyectos" data-nav="proyectos">

          Proyectos <span class="badge">2</span>

          Leads <span class="badge">7</span>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="6" y="8" width="12" height="10" rx="3"/><circle cx="9.5" cy="13" r="1"/><circle cx="14.5" cy="13" r="1"/><path d="M12 4v4M8 18v2M16 18v2"/></svg>

        <a href="#ajustes" data-nav="ajustes">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M3 12h2M19 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          Ajustes
        </a>
      </nav>
    </aside>

    <header class="head">
      <h1>Inmobiliaria Ibiza Office Hub</h1>
      <div class="head-right">
        <div class="pill"><i></i><span>5 bots activos</span></div>
        <div class="avatars" aria-hidden="true"><span></span><span></span><span></span></div>
        <button class="icon-btn" aria-label="Notificaciones">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 16V11a6 6 0 0112 0v5l2 2H4zM10 20h4"/></svg>
        </button>
        <button class="icon-btn" aria-label="Perfil" style="overflow:hidden;padding:0">
          <span style="width:100%;height:100%;display:block;background:linear-gradient(135deg,#f59e0b,#7c2d12)"></span>
        </button>
      </div>
    </header>

    <main class="stage">
      <div class="scene">
        <div class="frame" id="frame">
          <img src="assets/office-hub.jpg" alt="Inmobiliaria Ibiza Office Hub — vista isométrica de la oficina" width="1774" height="887" />
          <svg class="hitlayer" viewBox="0 0 1774 887" preserveAspectRatio="xMidYMid meet" aria-label="Módulos interactivos">
            <!-- Station hit boxes (approximate, linked to sectors) -->
            <rect class="station" data-id="scraping" x="210" y="95" width="300" height="230" rx="24" />
            <rect class="station" data-id="props" x="1180" y="70" width="320" height="240" rx="24" />
            <rect class="station" data-id="leads" x="1320" y="360" width="300" height="240" rx="24" />
            <rect class="station" data-id="finance" x="980" y="560" width="320" height="230" rx="24" />
            <rect class="station" data-id="agenda" x="480" y="560" width="320" height="230" rx="24" />
            <rect class="station" data-id="ai" x="180" y="360" width="300" height="240" rx="24" />
            <g id="pizza"></g>
          </svg>
          <div class="tooltip" id="tooltip" role="tooltip"></div>
        </div>
      </div>
      <div class="hint">Toca un sector del hub o una estación · estado Working / Needs you / Idle</div>
    </main>
  </div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="panel" id="panel" aria-hidden="true">
    <div class="panel-top">
      <div class="kicker"><span class="swatch" id="p-swatch"></span>Módulo Office Hub</div>
      <button class="close" id="close" aria-label="Cerrar">×</button>
    </div>
    <h2 id="p-title">—</h2>
    <p class="sub" id="p-sub"></p>
    <div class="status">
      <div class="orb working" id="p-orb"><span></span></div>
      <div>
        <strong id="p-status">Working</strong>
        <em id="p-note">Operativo</em>
      </div>
    </div>
    <div class="metrics" id="p-metrics"></div>
    <div class="actions">
      <button class="btn primary" type="button">Abrir módulo</button>
      <button class="btn ghost" type="button" id="close2">Volver a la oficina</button>
    </div>
  </aside>

<script>

  const MODULES = [

    {

    {
      id: "agenda",

      status: "working",
      bubble: "1 visita confirmada mañana",
      note: "Calendario sincronizado",
      metrics: [["Mañana", "1"], ["Semana", "4"], ["Notaría", "0"]]
    },
    {
      id: "ai",
      name: "IA & Automatización",
      sub: "Bots · Flujos · Integraciones",
      color: "#f97316",
      status: "idle",
      bubble: "Workflow actualizado",
      note: "Sin alertas · en reposo",
      metrics: [["Bots activos", "5"], ["Flujos", "11"], ["Errores", "0"]]
    }
  ];

  const STATUS = { working: "Working", needs: "Needs you", idle: "Idle" };

  // Photo pizza order (approx clockwise from top-left purple):
  // scraping, props, leads, finance, agenda, ai
  // Start angle: purple is upper-left ≈ -150° in SVG math where 0 is east.
  // We use degrees where 0 = top (north), clockwise.
  const START = -120; // tuned so first wedge sits on purple
  const SWEEP = 60;
  const GAP = 1.2;

  function polar(cx, cy, r, deg) {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }
  function wedge(rIn, rOut, a0, a1) {
    const large = (a1 - a0) > 180 ? 1 : 0;
    const [x0, y0] = polar(CX, CY, rOut, a0);
    const [x1, y1] = polar(CX, CY, rOut, a1);
    const [x2, y2] = polar(CX, CY, rIn, a1);
    const [x3, y3] = polar(CX, CY, rIn, a0);
    return `M ${x0} ${y0} A ${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1} L ${x2} ${y2} A ${rIn} ${rIn} 0 ${large} 0 ${x3} ${y3} Z`;
  }

  const pizza = document.getElementById("pizza");
  MODULES.forEach((mod, i) => {
    const a0 = START + i * SWEEP + GAP;
    const a1 = START + (i + 1) * SWEEP - GAP;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", wedge(R_IN, R_OUT, a0, a1));
    path.setAttribute("class", "sector");
    path.dataset.id = mod.id;
    path.style.color = mod.color;
    path.setAttribute("tabindex", "0");
    path.setAttribute("role", "button");
    path.setAttribute("aria-label", mod.name);
    pizza.appendChild(path);
  });

  const tooltip = document.getElementById("tooltip");
  const frame = document.getElementById("frame");
  const panel = document.getElementById("panel");
  const backdrop = document.getElementById("backdrop");
  let active = null;

  function mod(id) { return MODULES.find(m => m.id === id); }

  function showTip(m, clientX, clientY) {
    const rect = frame.getBoundingClientRect();
    tooltip.innerHTML = `<strong>${m.name}</strong><p>${m.bubble}</p><span class="tag ${m.status}">${STATUS[m.status]}</span>`;
    tooltip.style.left = (clientX - rect.left) + "px";
    tooltip.style.top = (clientY - rect.top) + "px";
    tooltip.classList.add("show");
  }
  function hideTip() { tooltip.classList.remove("show"); }

  function setHover(id, on) {
    document.querySelectorAll(`[data-id="${id}"]`).forEach(el => el.classList.toggle("is-hover", on));
  }

  function openPanel(m) {
    active = m.id;
    document.querySelectorAll(".sector, .station").forEach(el => {
      el.classList.toggle("is-active", el.dataset.id === m.id && el.classList.contains("sector"));
      el.classList.toggle("is-hover", el.dataset.id === m.id);
    });
    document.getElementById("p-swatch").style.background = m.color;
    document.getElementById("p-title").textContent = m.name;
    document.getElementById("p-sub").textContent = m.sub + " — " + m.bubble;
    const orb = document.getElementById("p-orb");
    orb.className = "orb " + m.status;
    document.getElementById("p-status").textContent = STATUS[m.status];
    document.getElementById("p-note").textContent = m.note;
    document.getElementById("p-metrics").innerHTML = m.metrics.map(([k, v]) =>
      `<div class="metric"><span>${k}</span><b>${v}</b></div>`
    ).join("");
    panel.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
    backdrop.classList.add("show");
    hideTip();
  }

  function closePanel() {
    active = null;
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
    backdrop.classList.remove("show");
    document.querySelectorAll(".sector, .station").forEach(el => {
      el.classList.remove("is-active", "is-hover");
    });
  }

  function onMove(e) {
    const t = e.target.closest("[data-id]");
    if (!t || active) return;
    const m = mod(t.dataset.id);
    if (!m) return;
    document.querySelectorAll(".sector, .station").forEach(el => el.classList.remove("is-hover"));
    setHover(m.id, true);
    showTip(m, e.clientX, e.clientY);
  }

  function onLeave() {
    if (active) return;
    document.querySelectorAll(".sector, .station").forEach(el => el.classList.remove("is-hover"));
    hideTip();
  }

  function onClick(e) {
    const t = e.target.closest("[data-id]");
    if (!t) return;
    const m = mod(t.dataset.id);
    if (m) openPanel(m);
  }

  const hit = frame.querySelector(".hitlayer");
  hit.addEventListener("pointermove", onMove);
  hit.addEventListener("pointerleave", onLeave);
  hit.addEventListener("click", onClick);
  hit.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const t = e.target.closest("[data-id]");
    if (!t) return;
    e.preventDefault();
    const m = mod(t.dataset.id);
    if (m) openPanel(m);
  });

  document.getElementById("close").onclick = closePanel;
  document.getElementById("close2").onclick = closePanel;
  backdrop.onclick = closePanel;
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });

  // Sidebar nav soft-highlights related modules
  document.querySelectorAll(".nav a").forEach(a => {
    a.addEventListener("click", (e) => {
      e.preventDefault();
      document.querySelectorAll(".nav a").forEach(x => x.classList.remove("active"));
      a.classList.add("active");
      const map = { leads: "leads", propiedades: "props", bots: "ai", proyectos: "scraping", ajustes: "ai", oficina: null };
      const id = map[a.dataset.nav];
      if (id) openPanel(mod(id));
      else closePanel();
    });
  });
})();
</script>
</body>
</html>
