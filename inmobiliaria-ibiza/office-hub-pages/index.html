<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Inmobiliaria Ibiza · Office Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --sand-0: #f6efe4;
    --sand-1: #ebe0cf;
    --sand-2: #d4c3a8;
    --sand-3: #b79d7a;
    --terra: #c45c3a;
    --terra-deep: #8f3a24;
    --navy: #16324f;
    --navy-mid: #1f4668;
    --ink: #1a1a18;
    --cream: #fffaf3;
    --ok: #2f7a5a;
    --warn: #c45c3a;
    --idle: #8a7d6b;
    --shadow: rgba(22, 50, 79, 0.28);
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    font-family: "Figtree", sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 700px at 18% -10%, #fff8ee 0%, transparent 55%),
      radial-gradient(900px 600px at 90% 10%, #dce8f4 0%, transparent 50%),
      linear-gradient(165deg, #f3e8d8 0%, #e5d4bc 42%, #cfd9e4 100%);
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.35;
    background-image:
      linear-gradient(rgba(22,50,79,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(22,50,79,0.04) 1px, transparent 1px);
    background-size: 48px 48px;
    mask-image: radial-gradient(ellipse at 50% 40%, #000 30%, transparent 75%);
  }

  .shell {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: clamp(16px, 3vw, 36px);
    gap: 8px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    z-index: 2;
  }

  .brand-mark {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: clamp(1.6rem, 3.2vw, 2.4rem);
    letter-spacing: -0.02em;
    color: var(--navy);
    line-height: 1;
  }

  .brand-mark span {
    display: block;
    font-family: "Figtree", sans-serif;
    font-weight: 500;
    font-size: 0.72rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--terra);
    margin-top: 6px;
  }

  .hint {
    font-size: 0.92rem;
    color: var(--navy-mid);
    max-width: 28ch;
    text-align: right;
    opacity: 0.85;
  }

  .stage-wrap {
    position: relative;
    display: grid;
    place-items: center;
    min-height: min(72vh, 760px);
    perspective: 1400px;
  }

  .floor {
    position: absolute;
    width: min(78vw, 640px);
    height: min(34vw, 280px);
    border-radius: 50%;
    background: radial-gradient(ellipse at 50% 40%, rgba(22,50,79,0.22), transparent 68%);
    transform: translateY(42%) scale(1.05);
    filter: blur(8px);
    animation: breathe 6s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.7; transform: translateY(42%) scale(1.02); }
    50% { opacity: 1; transform: translateY(42%) scale(1.08); }
  }

  .iso {
    position: relative;
    width: min(92vw, 720px);
    aspect-ratio: 1;
    --iso-rx: 58deg;
    --iso-rz: -28deg;
    transform: rotateX(var(--iso-rx)) rotateZ(var(--iso-rz));
    transform-style: preserve-3d;
    animation: settle-in 1.1s cubic-bezier(.2,.8,.2,1) both;
  }

  @keyframes settle-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .iso svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    filter: drop-shadow(0 28px 28px var(--shadow));
  }

  .sector {
    cursor: pointer;
    transition: filter 0.25s ease, opacity 0.25s ease;
  }

  .sector .face {
    transition: fill 0.25s ease, stroke 0.25s ease, transform 0.35s ease;
    stroke: rgba(255,250,243,0.55);
    stroke-width: 1.5;
  }

  .sector .side {
    transition: fill 0.25s ease, opacity 0.25s ease;
    opacity: 0.95;
  }

  .sector .label {
    font-family: "Figtree", sans-serif;
    font-weight: 700;
    font-size: 11px;
    fill: var(--cream);
    pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
    opacity: 0.95;
  }

  .sector .glyph {
    fill: none;
    stroke: var(--cream);
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    pointer-events: none;
    opacity: 0.95;
  }

  .sector:hover .face,
  .sector.is-hover .face,
  .sector.is-active .face {
    filter: brightness(1.12);
  }

  .sector:hover,
  .sector.is-hover {
    filter: drop-shadow(0 0 12px rgba(255,250,243,0.55));
  }

  .sector.is-active {
    filter: drop-shadow(0 0 18px rgba(196,92,58,0.55));
  }

  .sector.is-active .face {
    stroke: #fffaf3;
    stroke-width: 2.5;
  }

  .hub-ring {
    fill: var(--cream);
    stroke: var(--sand-2);
    stroke-width: 3;
    filter: drop-shadow(0 6px 10px rgba(22,50,79,0.18));
  }

  .hub-inner {
    fill: url(#hubGrad);
  }

  .hub-word {
    font-family: "Fraunces", serif;
    font-weight: 700;
    font-size: 15px;
    fill: var(--navy);
    letter-spacing: 0.5px;
  }

  .hub-sub {
    font-family: "Figtree", sans-serif;
    font-weight: 600;
    font-size: 7.5px;
    letter-spacing: 2.2px;
    fill: var(--terra);
    text-transform: uppercase;
  }

  .status-dot {
    pointer-events: none;
  }

  .tooltip {
    position: fixed;
    z-index: 40;
    pointer-events: none;
    padding: 10px 14px;
    border-radius: 12px;
    background: rgba(22, 50, 79, 0.94);
    color: var(--cream);
    font-size: 0.86rem;
    line-height: 1.35;
    box-shadow: 0 14px 40px rgba(22,50,79,0.35);
    opacity: 0;
    transform: translate(-50%, -120%) scale(0.96);
    transition: opacity 0.18s ease, transform 0.18s ease;
    max-width: 240px;
    backdrop-filter: blur(8px);
  }

  .tooltip.show {
    opacity: 1;
    transform: translate(-50%, -130%) scale(1);
  }

  .tooltip strong {
    display: block;
    font-family: "Fraunces", serif;
    font-size: 1rem;
    margin-bottom: 2px;
  }

  .tooltip .pill {
    display: inline-block;
    margin-top: 6px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .pill.working { background: rgba(47,122,90,0.25); color: #9de0c2; }
  .pill.needs   { background: rgba(196,92,58,0.3); color: #ffc3ad; }
  .pill.idle    { background: rgba(255,250,243,0.12); color: #d8cfc0; }

  .panel {
    position: fixed;
    top: 0;
    right: 0;
    width: min(380px, 100vw);
    height: 100vh;
    z-index: 50;
    background:
      linear-gradient(180deg, #fffaf3 0%, #f3e8d8 55%, #e8d8c4 100%);
    border-left: 1px solid rgba(22,50,79,0.12);
    box-shadow: -24px 0 60px rgba(22,50,79,0.22);
    transform: translateX(105%);
    transition: transform 0.45s cubic-bezier(.2,.8,.2,1);
    display: flex;
    flex-direction: column;
    padding: 28px 26px 24px;
  }

  .panel.open { transform: translateX(0); }

  .panel-close {
    align-self: flex-end;
    border: 0;
    background: transparent;
    color: var(--navy);
    font-size: 1.4rem;
    cursor: pointer;
    width: 40px;
    height: 40px;
    border-radius: 10px;
  }
  .panel-close:hover { background: rgba(22,50,79,0.08); }

  .panel-kicker {
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--terra);
    font-weight: 700;
    margin-top: 8px;
  }

  .panel h2 {
    font-family: "Fraunces", serif;
    font-size: 2rem;
    margin: 6px 0 10px;
    color: var(--navy);
    letter-spacing: -0.02em;
  }

  .panel .summary {
    color: var(--navy-mid);
    line-height: 1.5;
    margin: 0 0 22px;
  }

  .status-card {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
    padding: 16px;
    border-radius: 16px;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(22,50,79,0.08);
    margin-bottom: 18px;
  }

  .status-orb {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    position: relative;
  }

  .status-orb::after {
    content: "";
    position: absolute;
    inset: -4px;
    border-radius: 50%;
    border: 2px solid currentColor;
    opacity: 0.35;
    animation: pulse 2.2s ease-out infinite;
  }

  @keyframes pulse {
    0% { transform: scale(0.85); opacity: 0.45; }
    100% { transform: scale(1.25); opacity: 0; }
  }

  .status-orb.working { background: rgba(47,122,90,0.15); color: var(--ok); }
  .status-orb.needs   { background: rgba(196,92,58,0.18); color: var(--warn); }
  .status-orb.idle    { background: rgba(138,125,107,0.18); color: var(--idle); }

  .status-orb span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: currentColor;
  }

  .status-meta strong {
    display: block;
    font-size: 1.05rem;
    color: var(--navy);
  }
  .status-meta span {
    font-size: 0.88rem;
    color: var(--navy-mid);
  }

  .metrics {
    display: grid;
    gap: 10px;
    margin-bottom: 22px;
  }

  .metric {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 12px 14px;
    border-radius: 12px;
    background: rgba(22,50,79,0.05);
    font-size: 0.92rem;
  }
  .metric b { color: var(--navy); }
  .metric span { color: var(--navy-mid); }

  .panel-actions {
    margin-top: auto;
    display: grid;
    gap: 10px;
  }

  .btn {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: 14px 16px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .btn:hover { transform: translateY(-1px); filter: brightness(1.05); }
  .btn.primary {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-mid) 100%);
    color: var(--cream);
  }
  .btn.ghost {
    background: transparent;
    color: var(--navy);
    border: 1px solid rgba(22,50,79,0.2);
  }

  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(22,50,79,0.28);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 45;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  footer.note {
    text-align: center;
    font-size: 0.8rem;
    color: rgba(22,50,79,0.65);
    z-index: 1;
  }

  /* —— Mobile portrait —— */
  @media (max-width: 720px) and (orientation: portrait) {
    .shell {
      padding: 14px 14px 10px;
      min-height: 100dvh;
      gap: 4px;
    }
    header.top { flex-direction: column; align-items: flex-start; gap: 8px; }
    .brand-mark { font-size: 1.45rem; }
    .hint { text-align: left; max-width: none; font-size: 0.84rem; }
    .stage-wrap {
      min-height: 0;
      flex: 1;
      height: min(62dvh, 520px);
    }
    .iso { width: min(96vw, 420px); }
    .floor { width: min(86vw, 360px); height: min(38vw, 160px); }
    .sector .label { font-size: 9.5px; }
    .panel {
      width: 100vw;
      height: 100dvh;
      padding: 18px 18px 20px;
      border-left: 0;
      border-radius: 20px 20px 0 0;
      top: auto;
      bottom: 0;
      max-height: 88dvh;
      transform: translateY(105%);
    }
    .panel.open { transform: translateY(0); }
    .panel h2 { font-size: 1.55rem; }
  }

  /* —— Mobile / tablet landscape —— */
  @media (max-height: 520px) and (orientation: landscape),
         (max-width: 900px) and (orientation: landscape) {
    .shell {
      min-height: 100dvh;
      padding: 10px 16px;
      grid-template-rows: auto 1fr auto;
      gap: 2px;
    }
    header.top {
      align-items: center;
      gap: 12px;
    }
    .brand-mark { font-size: 1.2rem; }
    .brand-mark span { font-size: 0.62rem; margin-top: 2px; }
    .hint { font-size: 0.78rem; max-width: 36ch; }
    .stage-wrap {
      min-height: 0;
      height: calc(100dvh - 88px);
    }
    .iso {
      width: min(52vh, 48vw, 380px);
      --iso-rx: 56deg;
    }
    .floor {
      width: min(48vh, 42vw, 320px);
      height: min(18vh, 110px);
      transform: translateY(38%) scale(1.05);
    }
    .sector .label { font-size: 9px; }
    footer.note { font-size: 0.7rem; }
    .panel {
      width: min(360px, 46vw);
      height: 100dvh;
      padding: 16px 18px;
    }
    .panel h2 { font-size: 1.45rem; margin-bottom: 6px; }
    .panel .summary { margin-bottom: 12px; font-size: 0.9rem; }
    .metrics { margin-bottom: 12px; }
    .btn { padding: 11px 14px; }
  }

  @media (max-width: 720px) {
    header.top { flex-direction: column; align-items: flex-start; }
    .hint { text-align: left; max-width: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand-mark">
        Inmobiliaria Ibiza
        <span>Office Hub · mockup</span>
      </div>
      <p class="hint">Pasa el cursor por un sector. Haz clic para abrir el panel de estado del módulo.</p>
    </header>

    <div class="stage-wrap">
      <div class="floor" aria-hidden="true"></div>
      <div class="iso" id="iso">
        <svg viewBox="0 0 500 500" role="img" aria-label="Hub isométrico de módulos CRM">
          <defs>
            <radialGradient id="hubGrad" cx="40%" cy="35%" r="70%">
              <stop offset="0%" stop-color="#fffaf3"/>
              <stop offset="70%" stop-color="#f0e4d2"/>
              <stop offset="100%" stop-color="#dcc9ad"/>
            </radialGradient>
            <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3" stdDeviation="2" flood-color="#16324f" flood-opacity="0.18"/>
            </filter>
          </defs>
          <g id="extrude"></g>
          <g id="sectors"></g>
          <g id="hub">
            <circle class="hub-ring" cx="250" cy="250" r="78"/>
            <circle class="hub-inner" cx="250" cy="250" r="68"/>
            <text class="hub-word" x="250" y="244" text-anchor="middle">Ibiza</text>
            <text class="hub-sub" x="250" y="262" text-anchor="middle">INMOBILIARIA</text>
          </g>
        </svg>
      </div>
    </div>

    <footer class="note">Mockup visual · 10 de ~56 módulos · sin backend</footer>
  </div>

  <div class="tooltip" id="tooltip" role="tooltip"></div>
  <div class="backdrop" id="backdrop"></div>

  <aside class="panel" id="panel" aria-hidden="true">
    <button class="panel-close" id="close" aria-label="Cerrar">×</button>
    <div class="panel-kicker" id="p-kicker">Módulo</div>
    <h2 id="p-title">—</h2>
    <p class="summary" id="p-summary"></p>
    <div class="status-card">
      <div class="status-orb working" id="p-orb"><span></span></div>
      <div class="status-meta">
        <strong id="p-status">Working</strong>
        <span id="p-status-note">Sincronizado hace 2 min</span>
      </div>
    </div>
    <div class="metrics" id="p-metrics"></div>
    <div class="panel-actions">
      <button class="btn primary" type="button">Abrir módulo</button>
      <button class="btn ghost" type="button" id="close2">Volver al hub</button>
    </div>
  </aside>

<script>
(function () {
  const CX = 250, CY = 250;
  const R_OUT = 210, R_IN = 92, EX = 14;
  const GAP = 1.1; // degrees gap between slices

  const MODULES = [
    {
      id: "website", name: "Website", color: "#1f4668", side: "#16324f",
      status: "working", summary: "Web pública y vitrina de captación.",

    },
    {

    {

      status: "idle", summary: "Biblioteca, notas de encargo y papeles.",
      tip: "Sin actividad reciente",
      note: "En reposo desde ayer",
      metrics: [["Archivos", "214"], ["Privados", "18"], ["Por firmar", "0"]]
    },
    {
      id: "finanzas", name: "Finanzas", color: "#8f3a24", side: "#642817",
      status: "idle", summary: "Comisiones, pagos y estimaciones.",
      tip: "Cierre mensual pendiente",
      note: "Sin alertas críticas",
      metrics: [["Mes", "—"], ["Pendiente cobro", "2"], ["Estimado", "€48k"]]
    },
    {
      id: "equipo", name: "Equipo", color: "#4a6b58", side: "#334a3d",
      status: "working", summary: "Roles Zakir / Grace y colaboradores.",
      tip: "Grace online · 1 envío por aprobar",
      note: "Colaboración activa",
      metrics: [["En línea", "2"], ["Por aprobar", "1"], ["Colaboradores", "7"]]
    },
    {
      id: "informes", name: "Informes", color: "#5c6b82", side: "#3f4a5c",
      status: "idle", summary: "Informes de captación y rendimiento.",
      tip: "Informe semanal listo el lunes",
      note: "Programado",
      metrics: [["Semana", "OK"], ["Export", "PDF"], ["Vistas", "11"]]
    },
    {
      id: "ajustes", name: "Ajustes", color: "#7a6a58", side: "#564a3d",
      status: "working", summary: "Tokens, notificaciones y preferencias.",
      tip: "Push y secretos al día",
      note: "Configuración estable",
      metrics: [["Tokens", "OK"], ["Push", "ON"], ["Idioma", "ES / IT"]]
    }
  ];

  const STATUS_LABEL = {
    working: "Working",
    needs: "Needs you",
    idle: "Idle"
  };
  const STATUS_NOTE_DEFAULT = {
    working: "Operativo",
    needs: "Requiere atención",
    idle: "Sin actividad"
  };

  const sectorsG = document.getElementById("sectors");
  const extrudeG = document.getElementById("extrude");
  const tooltip = document.getElementById("tooltip");
  const panel = document.getElementById("panel");
  const backdrop = document.getElementById("backdrop");

  function polar(cx, cy, r, deg) {
    const a = (deg - 90) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function wedgePath(rIn, rOut, a0, a1) {
    const large = (a1 - a0) > 180 ? 1 : 0;
    const [x0, y0] = polar(CX, CY, rOut, a0);
    const [x1, y1] = polar(CX, CY, rOut, a1);
    const [x2, y2] = polar(CX, CY, rIn, a1);
    const [x3, y3] = polar(CX, CY, rIn, a0);
    return [
      `M ${x0} ${y0}`,
      `A ${rOut} ${rOut} 0 ${large} 1 ${x1} ${y1}`,
      `L ${x2} ${y2}`,
      `A ${rIn} ${rIn} 0 ${large} 0 ${x3} ${y3}`,
      "Z"
    ].join(" ");
  }

  function sideBand(a0, a1) {
    // Visible extrusion on the “far” edge of the ring (outer arc only)
    const large = (a1 - a0) > 180 ? 1 : 0;
    const [x0, y0] = polar(CX, CY, R_OUT, a0);
    const [x1, y1] = polar(CX, CY, R_OUT, a1);
    const [x2, y2] = polar(CX, CY + EX, R_OUT, a1);
    const [x3, y3] = polar(CX, CY + EX, R_OUT, a0);
    return [
      `M ${x0} ${y0}`,
      `A ${R_OUT} ${R_OUT} 0 ${large} 1 ${x1} ${y1}`,
      `L ${x2} ${y2}`,
      `A ${R_OUT} ${R_OUT} 0 ${large} 0 ${x3} ${y3}`,
      "Z"
    ].join(" ");
  }

  function iconPaths(id, x, y) {
    // Simple stroke icons centered at x,y (approx 18x18)
    const s = 9;
    const map = {
      website: `M ${x-s} ${y} A ${s} ${s} 0 1 0 ${x+s} ${y} A ${s} ${s} 0 1 0 ${x-s} ${y} M ${x-s} ${y} H ${x+s} M ${x} ${y-s} V ${y+s}`,
      catalogo: `M ${x-s} ${y-s} H ${x-1} V ${y+s} H ${x-s} Z M ${x+1} ${y-s} H ${x+s} V ${y+s} H ${x+1} Z`,
      chat: `M ${x-s} ${y-6} H ${x+s} V ${y+4} H ${x-2} L ${x-s} ${y+8} Z`,
      leads: `M ${x} ${y-s} A 5 5 0 1 0 ${x} ${y-s+0.01} M ${x-7} ${y+s} A 7 6 0 0 1 ${x+7} ${y+s}`,
      agenda: `M ${x-s} ${y-5} H ${x+s} V ${y+s} H ${x-s} Z M ${x-5} ${y-8} V ${y-2} M ${x+5} ${y-8} V ${y-2} M ${x-5} ${y+1} H ${x+5}`,
      docs: `M ${x-6} ${y-s} H ${x+2} L ${x+7} ${y-4} V ${y+s} H ${x-6} Z M ${x+2} ${y-s} V ${y-4} H ${x+7}`,
      finanzas: `M ${x-s} ${y+4} L ${x-3} ${y-2} L ${x+1} ${y+2} L ${x+s} ${y-s} M ${x+3} ${y-s} H ${x+s} V ${y-3}`,
      equipo: `M ${x-5} ${y-4} A 3.5 3.5 0 1 0 ${x-5} ${y-3.99} M ${x+5} ${y-4} A 3.5 3.5 0 1 0 ${x+5} ${y-3.99} M ${x-s} ${y+s} A 6 5 0 0 1 ${x-1} ${y+s} M ${x+1} ${y+s} A 6 5 0 0 1 ${x+s} ${y+s}`,
      informes: `M ${x-s} ${y+s} V ${y-2} H ${x-3} V ${y+s} Z M ${x-1} ${y+s} V ${y-s} H ${x+3} V ${y+s} Z M ${x+5} ${y+s} V ${y+1} H ${x+s} V ${y+s} Z`,
      ajustes: `M ${x} ${y-s} V ${y-5} M ${x} ${y+5} V ${y+s} M ${x-s} ${y} H ${x-5} M ${x+5} ${y} H ${x+s} M ${x} ${y} A 4 4 0 1 0 ${x} ${y+0.01}`
    };
    return map[id] || map.website;
  }

  const n = MODULES.length;
  const sweep = 360 / n;

  MODULES.forEach((mod, i) => {
    const a0 = i * sweep + GAP;
    const a1 = (i + 1) * sweep - GAP;
    const mid = (a0 + a1) / 2;
    const [lx, ly] = polar(CX, CY, (R_IN + R_OUT) / 2, mid);
    const [dx, dy] = polar(CX, CY, R_OUT - 18, mid);

    const side = document.createElementNS("http://www.w3.org/2000/svg", "path");
    side.setAttribute("d", sideBand(a0, a1));
    side.setAttribute("class", "side");
    side.setAttribute("fill", mod.side);
    extrudeG.appendChild(side);

    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
    g.setAttribute("class", "sector");
    g.dataset.id = mod.id;
    g.setAttribute("tabindex", "0");
    g.setAttribute("role", "button");
    g.setAttribute("aria-label", `${mod.name}: ${STATUS_LABEL[mod.status]}`);

    const face = document.createElementNS("http://www.w3.org/2000/svg", "path");
    face.setAttribute("d", wedgePath(R_IN, R_OUT, a0, a1));
    face.setAttribute("class", "face");
    face.setAttribute("fill", mod.color);
    face.setAttribute("filter", "url(#soft)");
    g.appendChild(face);

    const glyph = document.createElementNS("http://www.w3.org/2000/svg", "path");
    glyph.setAttribute("d", iconPaths(mod.id, lx, ly - 8));
    glyph.setAttribute("class", "glyph");
    g.appendChild(glyph);

    const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
    label.setAttribute("class", "label");
    label.setAttribute("x", lx);
    label.setAttribute("y", ly + 14);
    label.setAttribute("text-anchor", "middle");
    // Counter-rotate text roughly so it stays readable under iso tilt
    label.setAttribute("transform", `rotate(28 ${lx} ${ly + 14})`);
    label.textContent = mod.name;
    g.appendChild(label);

    const statusColor = mod.status === "working" ? "#9de0c2" : mod.status === "needs" ? "#ffb089" : "#d2c6b4";
    const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    dot.setAttribute("class", "status-dot");
    dot.setAttribute("cx", dx);
    dot.setAttribute("cy", dy);
    dot.setAttribute("r", 5);
    dot.setAttribute("fill", statusColor);
    dot.setAttribute("stroke", "#fffaf3");
    dot.setAttribute("stroke-width", "1.5");
    g.appendChild(dot);

    sectorsG.appendChild(g);
  });

  let activeId = null;

  function modById(id) {
    return MODULES.find(m => m.id === id);
  }

  function showTip(mod, clientX, clientY) {
    tooltip.innerHTML = `<strong>${mod.name}</strong>${mod.tip}<span class="pill ${mod.status}">${STATUS_LABEL[mod.status]}</span>`;
    tooltip.style.left = clientX + "px";
    tooltip.style.top = clientY + "px";
    tooltip.classList.add("show");
  }

  function hideTip() {
    tooltip.classList.remove("show");
  }

  function openPanel(mod) {
    activeId = mod.id;
    document.querySelectorAll(".sector").forEach(el => {
      el.classList.toggle("is-active", el.dataset.id === mod.id);
    });
    document.getElementById("p-kicker").textContent = "Módulo CRM";
    document.getElementById("p-title").textContent = mod.name;
    document.getElementById("p-summary").textContent = mod.summary;
    const orb = document.getElementById("p-orb");
    orb.className = "status-orb " + mod.status;
    document.getElementById("p-status").textContent = STATUS_LABEL[mod.status];
    document.getElementById("p-status-note").textContent = mod.note || STATUS_NOTE_DEFAULT[mod.status];
    document.getElementById("p-metrics").innerHTML = mod.metrics.map(([k, v]) =>
      `<div class="metric"><span>${k}</span><b>${v}</b></div>`
    ).join("");
    panel.classList.add("open");
    panel.setAttribute("aria-hidden", "false");
    backdrop.classList.add("show");
    hideTip();
  }

  function closePanel() {
    activeId = null;
    panel.classList.remove("open");
    panel.setAttribute("aria-hidden", "true");
    backdrop.classList.remove("show");
    document.querySelectorAll(".sector").forEach(el => el.classList.remove("is-active"));
  }

  sectorsG.addEventListener("pointermove", (e) => {
    const g = e.target.closest(".sector");
    if (!g || activeId) return;
    const mod = modById(g.dataset.id);
    if (!mod) return;
    document.querySelectorAll(".sector").forEach(el => el.classList.toggle("is-hover", el === g));
    showTip(mod, e.clientX, e.clientY);
  });

  sectorsG.addEventListener("pointerleave", () => {
    document.querySelectorAll(".sector").forEach(el => el.classList.remove("is-hover"));
    hideTip();
  });

  sectorsG.addEventListener("click", (e) => {
    const g = e.target.closest(".sector");
    if (!g) return;
    const mod = modById(g.dataset.id);
    if (mod) openPanel(mod);
  });

  sectorsG.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest(".sector");
    if (!g) return;
    e.preventDefault();
    const mod = modById(g.dataset.id);
    if (mod) openPanel(mod);
  });

  document.getElementById("close").addEventListener("click", closePanel);
  document.getElementById("close2").addEventListener("click", closePanel);
  backdrop.addEventListener("click", closePanel);
  window.addEventListener("keydown", (e) => { if (e.key === "Escape") closePanel(); });
})();
</script>
</body>
</html>
