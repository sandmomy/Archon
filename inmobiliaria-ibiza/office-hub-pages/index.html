<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Inmobiliaria Ibiza · Office Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ui-scale:1}
  html,body{margin:0;height:100%;overflow:hidden;background:#06080f;color:#eef3fb;font-family:"Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}

  /* ---- module labels (icon circle + title + subtitle) ---- */
  .tag{position:absolute;display:flex;align-items:flex-start;gap:8px;transform:translate(0,-50%) scale(var(--ui-scale));transform-origin:0 50%;pointer-events:none;white-space:nowrap;filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}
  .tag .ico{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -2px 4px rgba(0,0,0,.25)}
  .tag .ico svg{width:17px;height:17px;fill:#fff}
  .tag strong{display:block;font-family:"Outfit",sans-serif;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .tag em{display:block;font-style:normal;font-size:10.5px;color:#cbd5e1;margin-top:3px;font-weight:500;white-space:normal;max-width:170px;line-height:1.25}

  /* ---- speech bubbles ---- */
  .bubble{position:absolute;transform:translate(-50%,-50%) scale(var(--ui-scale));display:flex;align-items:center;gap:6px;background:#fff;color:#0b1220;padding:7px 11px 7px 9px;border-radius:10px;font-size:11px;font-weight:700;line-height:1.15;box-shadow:0 8px 18px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
  .bubble svg{width:13px;height:13px;fill:var(--c)}
  .bubble::after{content:"";position:absolute;left:14px;bottom:-5px;width:9px;height:9px;background:#fff;transform:rotate(45deg);border-radius:2px}
  .bubble.pop{animation:pop .45s cubic-bezier(.2,1.4,.3,1)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(calc(var(--ui-scale)*.7))}100%{transform:translate(-50%,-50%) scale(var(--ui-scale))}}

  /* ---- HUD ---- */
  .hud{position:fixed;z-index:5;display:flex;align-items:center;gap:10px}
  .brand{top:max(10px,env(safe-area-inset-top));left:14px;pointer-events:none}
  .brand .logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe29a 0,#ff9a3c 32%,#2b6fb0 33%,#164a78 60%,#0b2a46 100%);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .brand .logo svg{width:22px;height:22px;fill:#0f3d2e}
  .brand strong{display:block;font-family:"Outfit",sans-serif;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand span{display:block;font-size:12px;color:#c9d4e4;margin-top:3px;font-weight:600}
  .top-right{top:max(10px,env(safe-area-inset-top));right:14px}
  .pill{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;background:rgba(16,20,32,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:12.5px;font-weight:700}
  .pill i{width:8px;height:8px;border-radius:50%;background:#2ee56a;box-shadow:0 0 0 3px rgba(46,229,106,.22),0 0 10px #2ee56a}
  .avs{display:flex;margin-left:4px}
  .avs b{width:22px;height:22px;border-radius:50%;border:2px solid #10141f;margin-left:-7px;display:grid;place-items:center;font-size:9px;color:#fff}
  .ibtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(16,20,32,.72);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:#fff;position:relative}
  .ibtn svg{width:18px;height:18px;fill:#fff}
  .ibtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#ff4d5e;border:2px solid #10141f}
  .me{background:radial-gradient(circle at 35% 30%,#ffd4b5,#c77a4a 60%,#4b2a1a)}

  /* ---- sidebar like the concept ---- */
  .side{position:fixed;left:10px;top:78px;z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:rgba(12,15,24,.78);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#e5ebf5;font:inherit;font-size:12px;font-weight:600;padding:4px 10px 4px 5px;border-radius:11px;cursor:pointer;text-align:left;width:104px}
  .side button:hover{background:rgba(255,255,255,.06)}
  .side button.active{background:rgba(255,255,255,.12)}
  .side .ic{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 26px}
  .side .ic svg{width:13px;height:13px;fill:#dbe4f3}
  .side .n{margin-left:auto;background:#ff4d5e;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 5px}

  .toast{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:6;padding:8px 14px;border-radius:999px;font-size:12px;color:#e2e8f0;background:rgba(10,13,20,.8);border:1px solid rgba(255,255,255,.1);pointer-events:none;transition:all .4s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- detail panel ---- */
  .veil{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
  .veil.show{opacity:1;pointer-events:auto}
  .panel{position:fixed;right:0;top:0;height:100%;width:min(360px,100vw);background:linear-gradient(160deg,rgba(18,24,38,.97),rgba(8,11,19,.98));border-left:1px solid rgba(255,255,255,.1);transform:translateX(105%);transition:transform .4s cubic-bezier(.2,.85,.2,1);z-index:30;padding:18px;display:flex;flex-direction:column;gap:11px;box-sizing:border-box}
  .panel.open{transform:translateX(0)}
  .panel h2{margin:0;font-family:"Outfit",sans-serif;font-size:1.35rem;display:flex;align-items:center;gap:10px}
  .panel h2 .ico{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:0 0 34px}
  .panel h2 .ico svg{width:18px;height:18px;fill:#fff}
  .panel .sub{margin:0;color:#9aabbf;font-size:.9rem;line-height:1.4}
  .stat{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .orb{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
  .orb span{width:10px;height:10px;border-radius:50%;background:currentColor;box-shadow:0 0 12px currentColor}
  .orb.working{color:#2ee56a;background:rgba(46,229,106,.12)}
  .orb.needs{color:#ff4d5e;background:rgba(255,77,94,.12)}
  .orb.idle{color:#94a3b8;background:rgba(148,163,184,.12)}
  .metric{display:flex;justify-content:space-between;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);font-size:.88rem}
  .metric span{color:#9aabbf}
  .btn{border:0;border-radius:12px;padding:12px;font:inherit;font-weight:650;cursor:pointer}
  .btn.primary{background:linear-gradient(135deg,var(--accent,#8b5cf6),#1e3a5f);color:#fff}
  .btn.ghost{background:transparent;color:#fff;border:1px solid rgba(255,255,255,.14)}
  .x{margin-left:auto;width:36px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:transparent;color:#fff;font-size:1.2rem;cursor:pointer}
  .row{display:flex;align-items:center;gap:8px}

  @media (max-width:820px){
    .side button{width:auto}.side button span.t{display:none}.side{left:8px;padding:6px}
    .brand strong{font-size:15px}.brand .logo{width:32px;height:32px}
    .pill .avs{display:none}
  }
  @media (max-width:720px) and (orientation:portrait){
    .panel{top:auto;bottom:0;height:auto;max-height:76dvh;width:100vw;border-left:0;border-radius:18px 18px 0 0;transform:translateY(110%)}
    .panel.open{transform:translateY(0)}
    .side{top:auto;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);flex-direction:row;border-radius:999px}
    .side .n{position:absolute;margin:0;top:-4px;right:-4px}
    .side button{position:relative;padding:6px}
  }
</style>
</head>

  for (let i = 0; i < 4; i++) {
    placeRef();
    const v = P.clone().project(refCam);
    const px = (v.x * 0.5 + 0.5) * REF_W, py = (-v.y * 0.5 + 0.5) * REF_H;
    camTarget.x -= (PIZZA_PX.x - px) / PX_PER_UNIT;
    camTarget.z -= (PIZZA_PX.y - py) / (PX_PER_UNIT * Math.sin(PITCH));

})();

    camera.fov = fovFor(aspect, 10.2, CAM_DIST);
    camBase.set(-Math.cos(pitch) * CAM_DIST, Math.sin(pitch) * CAM_DIST, 0.8);

  const shape = new THREE.Shape();
  const r0 = 0.28, r1 = 2.62, gap = 0.045;
  const a0 = -Math.PI/6 + gap, a1 = Math.PI/6 - gap;
  shape.moveTo(Math.cos(a0)*r0, Math.sin(a0)*r0);
  for (let t=0;t<=24;t++){ const a=a0+(a1-a0)*(t/24); shape.lineTo(Math.cos(a)*r1, Math.sin(a)*r1); }
  shape.lineTo(Math.cos(a1)*r0, Math.sin(a1)*r0);
  const geo = new THREE.ExtrudeGeometry(shape, { depth:0.3, bevelEnabled:true, bevelThickness:0.06, bevelSize:0.05, bevelSegments:3 });
  geo.rotateX(-Math.PI/2);
  return geo;
})();

const whiteMat = new THREE.MeshStandardMaterial({ color:0xd9dee8, roughness:0.42, metalness:0.0, envMapIntensity:0.35 });

function makeBot(color) {

  const canL = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 0.11, 20), canMat); canL.rotation.z = Math.PI/2; canL.position.set(-0.43, 1.32, 0.04);
  const canR = canL.clone(); canR.position.x = 0.43;
  const rL = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.022, 8, 24), ringMat); rL.rotation.y = Math.PI/2; rL.position.set(-0.49, 1.32, 0.04);
  const rR = rL.clone(); rR.position.x = 0.49;
  const band = new THREE.Mesh(new THREE.TorusGeometry(0.44, 0.04, 8, 28, Math.PI), canMat); band.position.y = 1.34; band.position.z = 0.04;
  const armGeo = new THREE.CapsuleGeometry(0.07, 0.3, 4, 10);

/* ---------- workstations (square tiles on the iso grid) ---------- */
function screenTexture(mod) {
  const c = document.createElement("canvas"); c.width = 256; c.height = 160;
  const g = c.getContext("2d");
  g.fillStyle = "#0b1020"; g.fillRect(0,0,256,160);
  g.fillStyle = hex(mod.color); g.fillRect(0,0,256,26);
  g.fillStyle = "#fff"; g.font = "bold 13px Figtree, sans-serif"; g.fillText(mod.name.split(" &")[0], 10, 18);
  for (let i=0;i<5;i++){ g.fillStyle = `rgba(255,255,255,${0.12+Math.random()*0.15})`; g.fillRect(12, 40+i*20, 60+Math.random()*150, 9); }
  g.fillStyle = hex(mod.color); for (let i=0;i<6;i++){ g.globalAlpha = 0.5+Math.random()*0.5; g.fillRect(150+i*16, 150-20-Math.random()*60, 10, 80); }
  g.globalAlpha = 1;
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const TILE = 3.1;
function neonPad(color) {
  const g = new THREE.Group();
  const W = TILE, D = TILE, R = 0.32;
  const outer = roundedRect(W, D, R); const inner = roundedRect(W-0.22, D-0.22, R-0.1);
  outer.holes.push(inner);
  const rim = new THREE.Mesh(new THREE.ExtrudeGeometry(outer, { depth:0.05, bevelEnabled:false }),
    new THREE.MeshBasicMaterial({ color:new THREE.Color(color).multiplyScalar(2.2) }));
  rim.rotation.x = -Math.PI/2; rim.position.y = 0.0;
  const inside = new THREE.Mesh(new THREE.ExtrudeGeometry(roundedRect(W-0.22, D-0.22, R-0.1), { depth:0.035, bevelEnabled:false }),
    new THREE.MeshStandardMaterial({ color:0x0c1220, roughness:0.3, metalness:0.5, transparent:true, opacity:0.85, envMapIntensity:0.6 }));
  inside.rotation.x = -Math.PI/2; inside.receiveShadow = true;
  const glow = glowSprite(color, 9, 0.5);
  const light = new THREE.PointLight(color, 0.8, 6.5, 2); light.position.set(0, 1.9, 0.3);
  g.add(rim, inside, glow, light);
  g.userData = { rim, light, glow };
  return g;
}
const deskMat = new THREE.MeshStandardMaterial({ color:0x2a303d, roughness:0.35, metalness:0.35, envMapIntensity:0.6 });
const chairMat = new THREE.MeshStandardMaterial({ color:0x1a1f2b, roughness:0.6, metalness:0.2 });
function makeStation(mod) {
  const g = new THREE.Group();
  g.position.copy(groundAt(mod.tile[0], mod.tile[1]));

  const pad = neonPad(mod.color);
  const desk = new THREE.Mesh(new RoundedBoxGeometry(1.8, 0.08, 0.75, 2, 0.03), deskMat); desk.position.set(0, 0.72, 0.35); desk.castShadow = true;
  const panel = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.66, 0.06), deskMat); panel.position.set(0, 0.36, 0.7); panel.castShadow = true;
  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.68, 0.66), deskMat); legL.position.set(-0.86, 0.36, 0.35);
  const legR = legL.clone(); legR.position.x = 0.86;
  const tex = screenTexture(mod);
  const monitors = [];
  [[-0.46, 0.05],[0.46, 0.05]].forEach(([mx, mz], k) => {
    const frame = new THREE.Mesh(new RoundedBoxGeometry(0.8, 0.52, 0.05, 2, 0.02), visorMat); frame.position.set(mx, 1.1, mz); frame.rotation.y = (k?-1:1)*0.14; frame.castShadow = true;
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(0.73, 0.45), new THREE.MeshStandardMaterial({ map:tex, emissive:0xffffff, emissiveMap:tex, emissiveIntensity:1.1, roughness:0.4 }));
    scr.position.set(0, 0, 0.03); frame.add(scr);
    const stand = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.28, 8), visorMat); stand.position.set(mx, 0.86, mz+0.05);
    const foot = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.03, 16), visorMat); foot.position.set(mx, 0.76, mz+0.05);
    g.add(frame, stand, foot); monitors.push(scr);
  });
  const kb = new THREE.Mesh(new RoundedBoxGeometry(0.6, 0.03, 0.2, 2, 0.01), chairMat); kb.position.set(0, 0.77, 0.45);
  const mug = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.05, 0.11, 12), whiteMat); mug.position.set(0.72, 0.82, 0.5);
  const screenLight = new THREE.PointLight(mod.color, 0.25, 2.2, 2); screenLight.position.set(0, 1.2, -0.25);

  const chairSeat = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.1, 0.6, 2, 0.05), chairMat); chairSeat.position.set(0, 0.5, -0.55);
  const chairBack = new THREE.Mesh(new RoundedBoxGeometry(0.62, 0.7, 0.1, 2, 0.05), chairMat); chairBack.position.set(0, 0.9, -0.88);
  const chairPost = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.04, 0.4, 8), visorMat); chairPost.position.set(0, 0.28, -0.55);
  const chairBase = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.32, 0.04, 16), visorMat); chairBase.position.set(0, 0.04, -0.55);

  const bot = makeBot(mod.color); bot.position.set(0, 0.2, -0.6); bot.scale.setScalar(1.15);
  g.add(pad, desk, panel, legL, legR, kb, mug, screenLight, chairSeat, chairBack, chairPost, chairBase, bot);
  g.traverse(o => { if (o.isMesh) o.userData.id = mod.id; });
  g.userData = { mod, bot, pad, monitors, id:mod.id };
  scene.add(g);
  return g;
}
const stations = MODULES.map(makeStation);

}

/* ---------- DOM labels & bubbles ---------- */
stations.forEach(s => {

const _v = new THREE.Vector3();
function projectAt(obj, lx, ly, lz) {
  _v.set(lx, ly, lz); obj.localToWorld(_v); _v.project(camera);
  return { x:(_v.x*0.5+0.5)*innerWidth, y:(-_v.y*0.5+0.5)*innerHeight, ok:_v.z < 1 };
}
function layoutLabels() {
  const s = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--ui-scale")) || 1;
  stations.forEach(st => {
    const { mod, tag, bubble } = st.userData;
    const p = projectAt(st, 0, 0, 0);
    const tg = portrait ? [-50, -78] : mod.tag, bb = portrait ? [60, -36] : mod.bub;
    tag.style.left = (p.x + (tg[0]-15)*s) + "px"; tag.style.top = (p.y + tg[1]*s) + "px";
    bubble.style.left = (p.x + bb[0]*s) + "px"; bubble.style.top = (p.y + bb[1]*s) + "px";
  });
}

/* ---------- data pulses flying from stations into the hub ---------- */
const pulses = [];
const pulseGeo = new THREE.SphereGeometry(0.07, 10, 10);
function spawnPulse(st) {
  const from = new THREE.Vector3(0, 1.3, 0); st.localToWorld(from);
  const to = new THREE.Vector3(0, 1.0, 0);
  const mid = from.clone().lerp(to, 0.5); mid.y += 2.2;
  const curve = new THREE.QuadraticBezierCurve3(from, mid, to);
  const m = new THREE.Mesh(pulseGeo, new THREE.MeshBasicMaterial({ color:st.userData.mod.color }));
  const trail = new THREE.Mesh(new THREE.PlaneGeometry(0.5,0.5), new THREE.MeshBasicMaterial({ map:GLOW, color:st.userData.mod.color, transparent:true, opacity:0.8, blending:THREE.AdditiveBlending, depthWrite:false }));
  m.add(trail);
  scene.add(m); pulses.push({ m, trail, curve, t:0, speed:0.55 + Math.random()*0.25 });
}

/* ---------- sidebar ---------- */
const NAV = [["Oficina","home",null,null],["Proyectos","folder",2,"props"],["Leads","chart",7,"leads"],["Propiedades","building",null,"props"],["Bots","robot",null,"ai"],["Ajustes","gear",null,null]];
const sideEl = document.getElementById("side");
NAV.forEach(([label, ic, n, target], i) => {
  const b = document.createElement("button"); if (i===0) b.classList.add("active");
  b.innerHTML = `<span class="ic">${svg(ic)}</span><span class="t">${label}</span>${n?`<span class="n">${n}</span>`:""}`;
  b.onclick = () => { sideEl.querySelectorAll("button").forEach(x=>x.classList.remove("active")); b.classList.add("active");

let toastT; function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2200); }
document.getElementById("bell").onclick = () => toast("3 avisos: 1 ficha, 3 leads, 1 visita mañana");

/* ---------- interaction ---------- */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let activeId = null, hoverId = null;
const pickables = [];
stations.forEach(s => s.traverse(o => { if (o.isMesh && !o.material.map?.image?.width) pickables.push(o); }));
wedges.forEach(w => pickables.push(w.userData.mesh));

function openPanel(mod) {
  activeId = mod.id;
  const panel = document.getElementById("panel");
  panel.style.setProperty("--accent", hex(mod.color));
  document.getElementById("p-ico").innerHTML = svg(mod.icon);
  document.getElementById("p-title").textContent = mod.name;
  document.getElementById("p-sub").textContent = mod.sub + " — " + mod.bubbles[0];
  document.getElementById("p-orb").className = "orb " + mod.status;
  document.getElementById("p-status").textContent = STATUS[mod.status];
  document.getElementById("p-note").textContent = mod.note;
  document.getElementById("p-metrics").innerHTML = mod.metrics.map(([k,v]) => `<div class="metric"><span>${k}</span><b>${v}</b></div>`).join("");
  panel.classList.add("open"); document.getElementById("veil").classList.add("show");
}
function closePanel(){ activeId = null; document.getElementById("panel").classList.remove("open"); document.getElementById("veil").classList.remove("show"); }
function hitId(cx, cy) {
  pointer.x = (cx / innerWidth) * 2 - 1; pointer.y = -(cy / innerHeight) * 2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(pickables, false);
  return hits.length ? hits[0].object.userData.id : null;
}
let downAt = null;
canvas.addEventListener("pointerdown", e => { downAt = [e.clientX, e.clientY]; });
canvas.addEventListener("pointerup", e => {
  if (!downAt) return; const moved = Math.hypot(e.clientX-downAt[0], e.clientY-downAt[1]); downAt = null; if (moved > 8) return;
  const id = hitId(e.clientX, e.clientY); const mod = MODULES.find(m => m.id === id); if (mod) openPanel(mod);
});
canvas.addEventListener("pointermove", e => { if (e.pointerType === "mouse") { hoverId = hitId(e.clientX, e.clientY); canvas.style.cursor = hoverId ? "pointer" : "default"; } });
document.getElementById("close").onclick = closePanel; document.getElementById("close2").onclick = closePanel; document.getElementById("veil").onclick = closePanel;
document.getElementById("enter").onclick = () => toast("Abriendo módulo…");

/* ---------- post-processing: bloom for the neon ---------- */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.6, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ---------- live loop ---------- */
const clock = new THREE.Clock();
let lastPulse = 0;
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime(), dt = Math.min(clock.getDelta(), 0.05) || 0.016;

  hubLight.intensity = 1.4 + Math.sin(t*2.2)*0.35;
  ring.material.color.setHex(0x55a8ff).multiplyScalar(2.0 + Math.sin(t*2.2)*0.4);
  wedges.forEach(w => {
    const lift = (w.userData.id === activeId || w.userData.id === hoverId) ? 0.22 : 0;
    w.userData.mesh.position.y += (w.userData.baseY + lift - w.userData.mesh.position.y) * 0.15;
    w.userData.mat.emissiveIntensity = 0.26 + (lift ? 0.25 : 0) + Math.sin(t*1.5 + w.userData.id.length)*0.04;
  });

  stations.forEach((s, i) => {
    const { bot, pad, monitors, mod } = s.userData;
    const ph = bot.userData.phase;
    const busy = mod.status !== "idle";
    bot.position.y = 0.2 + Math.sin(t*2.1 + ph) * 0.03;
    bot.userData.head.rotation.y = Math.sin(t*0.9 + ph) * 0.35;
    bot.userData.head.rotation.x = Math.sin(t*1.7 + ph) * 0.06;
    bot.userData.arms.forEach((a, k) => { a.position.y = 0.7 + (busy ? Math.sin(t*9 + ph + k*1.6) * 0.03 : 0); });
    const pulse = 0.85 + Math.sin(t*2.4 + i) * 0.15;
    pad.userData.light.intensity = (busy ? 0.7 : 0.45) * pulse;
    pad.userData.glow.material.opacity = 0.42 + Math.sin(t*2.4 + i) * 0.08;
    monitors.forEach((m, k) => { m.material.emissiveIntensity = 1.0 + Math.sin(t*6 + ph + k) * 0.12; });
    const active = s.userData.id === activeId || s.userData.id === hoverId;
    s.scale.setScalar(THREE.MathUtils.lerp(s.scale.x, active ? 1.05 : 1, 0.12));
  });

  if (t - lastPulse > 0.9) { lastPulse = t; spawnPulse(stations[Math.floor(Math.random()*stations.length)]); }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += dt * p.speed;
    if (p.t >= 1) { scene.remove(p.m); pulses.splice(i, 1); continue; }
    p.curve.getPoint(p.t, p.m.position); p.trail.lookAt(camera.position); p.trail.material.opacity = 0.9 * (1 - p.t*0.6);
  }

  camera.position.set(camBase.x + Math.sin(t*0.18)*0.12, camBase.y + Math.sin(t*0.23)*0.06, camBase.z + Math.cos(t*0.15)*0.1);
  camera.lookAt(portrait ? portraitTarget : camTarget);
  layoutLabels();
  composer.render();
}
window.addEventListener("resize", () => {
  placeCamera(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* live chatter */
setInterval(() => {
  const s = stations[Math.floor(Math.random() * stations.length)];
  const mod = s.userData.mod;
  s.userData.bubbleIdx = (s.userData.bubbleIdx + 1) % mod.bubbles.length;
  const text = mod.bubbles[s.userData.bubbleIdx];
  s.userData.bubble.querySelector("span").textContent = text;
  s.userData.bubble.classList.remove("pop"); void s.userData.bubble.offsetWidth; s.userData.bubble.classList.add("pop");
  document.getElementById("liveCount").textContent = (4 + Math.floor(Math.random()*2)) + " bots activos";
}, 3400);

if (innerHeight > innerWidth) setTimeout(() => toast("Gira el móvil para ver la oficina completa"), 1200);
animate();
