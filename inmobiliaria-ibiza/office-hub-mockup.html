<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Inmobiliaria Ibiza · Office Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Figtree:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--ui-scale:1}
  html,body{margin:0;height:100%;overflow:hidden;background:#06080f;color:#eef3fb;font-family:"Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3}
  .vignette{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 55%,rgba(0,0,0,.42) 100%)}

  /* ---- module labels (icon circle + title + subtitle) ---- */
  .tag{position:absolute;display:flex;align-items:flex-start;gap:8px;transform:translate(0,-50%) scale(var(--ui-scale));transform-origin:0 50%;pointer-events:none;white-space:nowrap;filter:drop-shadow(0 2px 6px rgba(0,0,0,.9))}
  .tag .ico{width:30px;height:30px;border-radius:50%;flex:0 0 30px;display:grid;place-items:center;background:var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent),inset 0 -2px 4px rgba(0,0,0,.25)}
  .tag .ico svg{width:17px;height:17px;fill:#fff}
  .tag strong{display:block;font-family:"Outfit",sans-serif;font-size:14px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
  .tag em{display:block;font-style:normal;font-size:10.5px;color:#cbd5e1;margin-top:3px;font-weight:500;white-space:normal;max-width:170px;line-height:1.25}

  /* ---- speech bubbles ---- */
  .bubble{position:absolute;transform:translate(-50%,-50%) scale(var(--ui-scale));display:flex;align-items:center;gap:6px;background:#fff;color:#0b1220;padding:7px 11px 7px 9px;border-radius:10px;font-size:11px;font-weight:700;line-height:1.15;box-shadow:0 8px 18px rgba(0,0,0,.45);pointer-events:none;white-space:nowrap}
  .bubble svg{width:13px;height:13px;fill:var(--c)}
  .bubble::after{content:"";position:absolute;left:14px;bottom:-5px;width:9px;height:9px;background:#fff;transform:rotate(45deg);border-radius:2px}
  .bubble.pop{animation:pop .45s cubic-bezier(.2,1.4,.3,1)}
  @keyframes pop{0%{transform:translate(-50%,-50%) scale(calc(var(--ui-scale)*.7))}100%{transform:translate(-50%,-50%) scale(var(--ui-scale))}}

  /* ---- HUD ---- */
  .hud{position:fixed;z-index:5;display:flex;align-items:center;gap:10px}
  .brand{top:max(10px,env(safe-area-inset-top));left:14px;pointer-events:none}
  .brand .logo{width:36px;height:36px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#ffe29a 0,#ff9a3c 32%,#2b6fb0 33%,#164a78 60%,#0b2a46 100%);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  .brand .logo svg{width:22px;height:22px;fill:#0f3d2e}
  .brand strong{display:block;font-family:"Outfit",sans-serif;font-size:17px;font-weight:800;letter-spacing:-.02em;line-height:1}
  .brand span{display:block;font-size:12px;color:#c9d4e4;margin-top:3px;font-weight:600}
  .top-right{top:max(10px,env(safe-area-inset-top));right:14px}
  .pill{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 10px;border-radius:999px;background:rgba(16,20,32,.72);border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(8px);font-size:12.5px;font-weight:700}
  .pill i{width:8px;height:8px;border-radius:50%;background:#2ee56a;box-shadow:0 0 0 3px rgba(46,229,106,.22),0 0 10px #2ee56a}
  .avs{display:flex;margin-left:4px}
  .avs b{width:22px;height:22px;border-radius:50%;border:2px solid #10141f;margin-left:-7px;display:grid;place-items:center;font-size:9px;color:#fff}
  .ibtn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.1);background:rgba(16,20,32,.72);backdrop-filter:blur(8px);display:grid;place-items:center;cursor:pointer;color:#fff;position:relative}
  .ibtn svg{width:18px;height:18px;fill:#fff}
  .ibtn .dot{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#ff4d5e;border:2px solid #10141f}
  .me{background:radial-gradient(circle at 35% 30%,#ffd4b5,#c77a4a 60%,#4b2a1a)}

  /* ---- sidebar like the concept ---- */
  .side{position:fixed;left:10px;top:78px;z-index:5;display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:16px;background:rgba(12,15,24,.78);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
  .side button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:#e5ebf5;font:inherit;font-size:12px;font-weight:600;padding:4px 10px 4px 5px;border-radius:11px;cursor:pointer;text-align:left;width:104px}
  .side button:hover{background:rgba(255,255,255,.06)}
  .side button.active{background:rgba(255,255,255,.12)}
  .side .ic{width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:0 0 26px}
  .side .ic svg{width:13px;height:13px;fill:#dbe4f3}
  .side .n{margin-left:auto;background:#ff4d5e;color:#fff;font-size:9px;font-weight:800;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 5px}

  .toast{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);opacity:0;z-index:6;padding:8px 14px;border-radius:999px;font-size:12px;color:#e2e8f0;background:rgba(10,13,20,.8);border:1px solid rgba(255,255,255,.1);pointer-events:none;transition:all .4s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ---- module console: the bot's screen, managed face to face ---- */
  #labels{transition:opacity .35s}
  body.focus #labels{opacity:0}
  body.focus .vignette{background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,0) 50%,rgba(0,0,0,.55) 100%)}
  .console{position:fixed;z-index:8;display:flex;flex-direction:column;opacity:0;pointer-events:none;transform:translateY(14px) scale(.96);transition:opacity .45s,transform .45s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(170deg,rgba(14,19,32,.94),rgba(7,10,18,.96));border:1px solid color-mix(in srgb,var(--c) 45%,rgba(255,255,255,.12));border-radius:14px;
    box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 70px rgba(0,0,0,.65),0 0 60px color-mix(in srgb,var(--c) 28%,transparent);overflow:hidden;color:#eef3fb;font-size:12px}
  .console::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px);mix-blend-mode:screen}
  .console.show{opacity:1;pointer-events:auto;transform:none}
  .console header{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.08);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 30%,transparent),transparent 70%)}
  .console header .ico{width:32px;height:32px;border-radius:50%;background:var(--c);display:grid;place-items:center;flex:0 0 32px;box-shadow:0 0 14px color-mix(in srgb,var(--c) 70%,transparent)}
  .console header .ico svg{width:17px;height:17px;fill:#fff}
  .console header strong{display:block;font-family:"Outfit",sans-serif;font-size:15px;font-weight:700;line-height:1.1}
  .console header em{display:block;font-style:normal;font-size:10.5px;color:#b8c4d6;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .console .ttl{min-width:0;flex:1}
  .console .st{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:rgba(255,255,255,.06);white-space:nowrap}
  .console .st i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
  .console .st.working{color:#2ee56a}.console .st.needs{color:#ff4d5e}.console .st.idle{color:#94a3b8}
  .console .clock{font-family:"Outfit",sans-serif;font-size:14px;font-weight:600;color:#cbd5e1;font-variant-numeric:tabular-nums}
  .console .back{border:0;border-radius:999px;padding:7px 11px;font:inherit;font-size:11px;font-weight:700;cursor:pointer;background:#fff;color:#0b1220;white-space:nowrap}
  .console .back:hover{background:#e6ecf5}
  .console .tabs{display:flex;gap:2px;padding:6px 10px 0;border-bottom:1px solid rgba(255,255,255,.08)}
  .console .tabs button{border:0;background:transparent;color:#9fb0c6;font:inherit;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:9px 9px 0 0;cursor:pointer;position:relative}
  .console .tabs button.on{color:#fff}
  .console .tabs button.on::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:var(--c);box-shadow:0 0 8px var(--c)}
  .console .tabs button .n{margin-left:6px;background:var(--c);color:#fff;font-size:9px;padding:1px 5px;border-radius:7px}
  .console .body{flex:1;min-height:0;overflow:auto;padding:10px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
  .console .tab{display:none}.console .tab.on{display:block}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .card{padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.07);border-top:2px solid var(--c)}
  .card span{display:block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb0c6;font-weight:700}
  .card b{display:block;font-family:"Outfit",sans-serif;font-size:22px;font-weight:700;margin-top:3px}
  .two{display:grid;grid-template-columns:1.25fr 1fr;gap:8px;margin-top:8px}
  .box{padding:9px 11px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
  .box h4{margin:0 0 6px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:#9fb0c6;font-weight:700;display:flex;align-items:center;gap:6px}
  .box h4 i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
  .box canvas{width:100%;height:84px;display:block}
  .task{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);margin-bottom:6px}
  .task .chk{width:18px;height:18px;border-radius:6px;border:1.5px solid rgba(255,255,255,.25);display:grid;place-items:center;flex:0 0 18px;cursor:pointer;background:transparent}
  .task.done .chk{background:var(--c);border-color:var(--c)}
  .task .chk svg{width:12px;height:12px;fill:#fff;opacity:0}.task.done .chk svg{opacity:1}
  .task .tx{flex:1;min-width:0}.task .tx b{display:block;font-size:12px;font-weight:700}.task.done .tx b{text-decoration:line-through;color:#8a9bb3}
  .task .tx small{display:block;color:#9fb0c6;font-size:10.5px;margin-top:1px}
  .task .mini{border:1px solid rgba(255,255,255,.14);background:transparent;color:#dbe4f3;font:inherit;font-size:10.5px;font-weight:700;padding:5px 8px;border-radius:8px;cursor:pointer;white-space:nowrap}
  .task .mini:hover{background:rgba(255,255,255,.08)}
  .acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .act{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:11px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);color:#fff;font:inherit;cursor:pointer;text-align:left;position:relative;overflow:hidden}
  .act:hover{background:rgba(255,255,255,.08);border-color:color-mix(in srgb,var(--c) 60%,transparent)}
  .act .ai{width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--c) 25%,transparent);display:grid;place-items:center}
  .act .ai svg{width:15px;height:15px;fill:var(--c)}
  .act b{font-size:12px;font-weight:700;line-height:1.15}.act small{color:#9fb0c6;font-size:10.5px;line-height:1.3}
  .act.run::after{content:"";position:absolute;left:0;bottom:0;height:2px;background:var(--c);box-shadow:0 0 8px var(--c);animation:run 1.4s linear forwards}
  @keyframes run{from{width:0}to{width:100%}}
  .act.primary{background:linear-gradient(135deg,color-mix(in srgb,var(--c) 55%,transparent),rgba(255,255,255,.04))}
  .log{margin:0;padding:0;list-style:none;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px}
  .log li{display:flex;gap:10px;padding:5px 0;border-bottom:1px dashed rgba(255,255,255,.06);color:#dbe4f3}
  .log li time{color:#8a9bb3;flex:0 0 46px}.log li.new{color:#fff;animation:fadein .4s}
  .log li.new::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);margin-top:5px;flex:0 0 6px}
  @keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
  .prog{height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
  .prog i{display:block;height:100%;width:40%;background:var(--c);box-shadow:0 0 10px var(--c);border-radius:3px;transition:width .6s}
  .console footer{display:flex;align-items:center;gap:10px;padding:8px 12px;border-top:1px solid rgba(255,255,255,.08);font-size:11px;color:#b8c4d6}
  .switch{position:relative;width:34px;height:20px;flex:0 0 34px}
  .switch input{opacity:0;width:0;height:0;position:absolute}
  .switch span{position:absolute;inset:0;border-radius:10px;background:rgba(255,255,255,.14);transition:.25s;cursor:pointer}
  .switch span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.25s}
  .switch input:checked+span{background:var(--c);box-shadow:0 0 10px color-mix(in srgb,var(--c) 60%,transparent)}
  .switch input:checked+span::after{transform:translateX(14px)}
  .console footer .sp{margin-left:auto;color:#8a9bb3;font-size:10.5px}

  @media (max-width:820px){
    .side button{width:auto}.side button span.t{display:none}.side{left:8px;padding:6px}
    .brand strong{font-size:15px}.brand .logo{width:32px;height:32px}
    .pill .avs{display:none}
  }
  @media (max-width:720px) and (orientation:portrait){
    .console header em{display:none}.console .clock{display:none}.cards{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}.acts{grid-template-columns:1fr 1fr}
    .side{top:auto;bottom:max(12px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);flex-direction:row;border-radius:999px}
    .side .n{position:absolute;margin:0;top:-4px;right:-4px}
    .side button{position:relative;padding:6px}
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="labels"></div>
<div class="vignette"></div>

<div class="hud brand">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 22h-2v-9.1c-1.9.3-3.6 1.4-4.7 3.1l-1.6-1.2c1.2-1.7 2.9-2.9 4.9-3.4-2.4-.3-4.6-1.5-6.1-3.4l1.6-1.2c1.2 1.6 3 2.6 4.9 2.9-1.5-1.6-2.3-3.7-2.3-5.9h2c0 2 .8 3.9 2.3 5.3 1.5-1.4 2.3-3.3 2.3-5.3h2c0 2.2-.8 4.3-2.3 5.9 1.9-.3 3.7-1.3 4.9-2.9l1.6 1.2c-1.5 1.9-3.7 3.1-6.1 3.4 2 .5 3.7 1.7 4.9 3.4l-1.6 1.2c-1.1-1.7-2.8-2.8-4.7-3.1V22z"/></svg></div>
  <div><strong>Inmobiliaria Ibiza</strong><span>Office Hub</span></div>
</div>

<div class="hud top-right">
  <div class="pill"><i></i><span id="liveCount">5 bots activos</span>
    <span class="avs"><b style="background:#8b5cf6">S</b><b style="background:#f59e0b">P</b><b style="background:#22c55e">L</b></span></div>
  <button class="ibtn" id="bell" aria-label="Notificaciones"><svg viewBox="0 0 24 24"><path d="M12 22a2 2 0 0 0 2-2h-4a2 2 0 0 0 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4a1.5 1.5 0 0 0-3 0v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span class="dot"></span></button>
  <button class="ibtn me" aria-label="Perfil"></button>
</div>

<nav class="side" id="side"></nav>
<div class="toast" id="toast"></div>

<section class="console" id="console" aria-live="polite">
  <header>
    <span class="ico" id="c-ico"></span>
    <div class="ttl"><strong id="c-title">—</strong><em id="c-sub"></em></div>
    <span class="st working" id="c-status"><i></i><span>Working</span></span>
    <span class="clock" id="c-clock">--:--</span>
    <button type="button" class="back" id="c-back">Volver a la oficina</button>
  </header>
  <nav class="tabs" id="c-tabs">
    <button data-tab="resumen" class="on">Resumen</button>
    <button data-tab="tareas">Tareas<span class="n" id="c-ntasks">0</span></button>
    <button data-tab="acciones">Acciones</button>
    <button data-tab="registro">Registro</button>
  </nav>
  <div class="body">
    <div class="tab on" data-tab="resumen" id="c-resumen"></div>
    <div class="tab" data-tab="tareas" id="c-tareas"></div>
    <div class="tab" data-tab="acciones" id="c-acciones"></div>
    <div class="tab" data-tab="registro"><ul class="log" id="c-log"></ul></div>
  </div>
  <footer>
    <label class="switch"><input type="checkbox" id="c-active"><span></span></label>
    <span id="c-foot">Bot activo</span>
    <span class="sp" id="c-id"></span>
  </footer>
</section>

  refCam.position.set(camTarget.x, camTarget.y + Math.sin(PITCH) * CAM_DIST, camTarget.z + Math.cos(PITCH) * CAM_DIST);

  const P = new THREE.Vector3(0, HUB_TOP_Y, 0);
  for (let i = 0; i < 4; i++) {
    placeRef();
    const v = P.clone().project(refCam);
    const px = (v.x * 0.5 + 0.5) * REF_W, py = (-v.y * 0.5 + 0.5) * REF_H;
    camTarget.x -= (PIZZA_PX.x - px) / PX_PER_UNIT;
    camTarget.z -= (PIZZA_PX.y - py) / (PX_PER_UNIT * Math.sin(PITCH));

  placeRef();
})();

  const p = new THREE.Vector3(); _ray.ray.intersectPlane(groundPlane, p); return p;
}

    officeFov = fovFor(aspect, 10.2, CAM_DIST);
    camBase.set(-Math.cos(pitch) * CAM_DIST, Math.sin(pitch) * CAM_DIST, 0.8);

}

  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);

    const name = o.material?.name;
    const live = mats[name] || sharedAssetMats[name]?.();
    if (live) o.material = live;
    o.castShadow = true; o.receiveShadow = false;
    if (id) o.userData.id = id;

  ringArcs.forEach((a, i) => { const hot = a.userData.id === activeId || a.userData.id === hoverId; a.material.color.copy(a.userData.base).multiplyScalar((hot ? 3.2 : 2.0) + Math.sin(t*2.2 + i)*0.35); });
  wedges.forEach(w => {
    const lift = (w.userData.id === activeId || w.userData.id === hoverId) ? 0.22 : 0;
    w.userData.mesh.position.y += (w.userData.baseY + lift - w.userData.mesh.position.y) * 0.15;
    w.userData.mat.emissiveIntensity = 0.26 + (lift ? 0.25 : 0) + Math.sin(t*1.5 + w.userData.id.length)*0.04;
  });

  stations.forEach((s, i) => {
    const { bot, pad, monitors, mod } = s.userData;
    const ph = bot.userData.phase;
    const focused = s === focusSt;
    const busy = stateFor(mod).active;
    bot.position.y = BOT_SEAT_Y + Math.sin(t*2.1 + ph) * 0.02;
    if (bot.userData.head) {
      // face to face, the bot looks up at us over its screen
      bot.userData.head.rotation.y = Math.sin(t*0.9 + ph) * (focused ? 0.05 : 0.35);
      bot.userData.head.rotation.x = (focused ? -0.12 : 0.08) + Math.sin(t*1.7 + ph) * 0.05;
      bot.userData.arms.forEach((a, k) => { a.position.y = a.userData.baseY + (busy ? Math.sin(t*9 + ph + k*1.6) * 0.03 : 0); a.rotation.x = busy ? Math.sin(t*9 + ph + k*1.6) * 0.12 : 0; });
    }
    const pulse = 0.85 + Math.sin(t*2.4 + i) * 0.15;
    pad.userData.light.intensity = (busy ? 0.7 : 0.45) * pulse;
    pad.userData.glow.material.opacity = 0.42 + Math.sin(t*2.4 + i) * 0.08;
    monitors.forEach((m, k) => { m.material.emissiveIntensity = 1.0 + Math.sin(t*6 + ph + k) * 0.12; });
    const active = !focusSt && (s.userData.id === activeId || s.userData.id === hoverId);
    s.scale.setScalar(THREE.MathUtils.lerp(s.scale.x, active ? 1.05 : 1, 0.12));
  });

  if (!focusSt && t - lastPulse > 0.9) { lastPulse = t; spawnPulse(stations[Math.floor(Math.random()*stations.length)]); }
  for (let i = pulses.length - 1; i >= 0; i--) {
    const p = pulses[i]; p.t += dt * p.speed;
    if (p.t >= 1) { scene.remove(p.m); pulses.splice(i, 1); continue; }
    p.curve.getPoint(p.t, p.m.position); p.trail.lookAt(camera.position); p.trail.material.opacity = 0.9 * (1 - p.t*0.6);
  }

  updateCamera(t, dt);
  if (focusSt) { placeConsole(); if (Math.floor(t*5) !== Math.floor((t-dt)*5)) { document.getElementById("c-clock").textContent = nowHM(); drawChart(t); } }
  else layoutLabels();
  composer.render();
}
window.addEventListener("resize", () => {
  placeCamera(); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

/* live chatter */
setInterval(() => {
  const s = stations[Math.floor(Math.random() * stations.length)];
  const mod = s.userData.mod;
  s.userData.bubbleIdx = (s.userData.bubbleIdx + 1) % mod.bubbles.length;
  const text = mod.bubbles[s.userData.bubbleIdx];
  s.userData.bubble.querySelector("span").textContent = text;
  s.userData.bubble.classList.remove("pop"); void s.userData.bubble.offsetWidth; s.userData.bubble.classList.add("pop");
  document.getElementById("liveCount").textContent = (4 + Math.floor(Math.random()*2)) + " bots activos";
}, 3400);

if (innerHeight > innerWidth) setTimeout(() => toast("Gira el móvil para ver la oficina completa"), 1200);
// deep link: ?focus=<module id> opens straight at that bot's desk
const deepParams = new URLSearchParams(location.search);
const deep = MODULES.find(m => m.id === deepParams.get("focus"));
if (deep) { const tab = deepParams.get("tab"); if (tab) stateFor(deep).tab = tab; enterFocus(deep); camBlend = 1; }
animate();
</script>
