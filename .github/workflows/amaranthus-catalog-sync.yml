name: Amaranthus catalog sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - "amaranthus-crm/sync/**"
      - ".github/workflows/amaranthus-catalog-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install pillow

      - name: Sync catalog from official site
        run: python3 amaranthus-crm/sync/sync_catalog.py

      - name: Commit and push catalog if changed
        run: |
          git config user.name "amaranthus-catalog-bot"
          git config user.email "bot@users.noreply.github.com"
          git add amaranthus-crm/site/data.json amaranthus-crm/site/sync-meta.json amaranthus-crm/site/th || true
          if git diff --staged --quiet; then
            echo "No catalog changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore(amaranthus): sync catalog from amaranthus-realestate.com"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
        id: commit

      - name: Deploy CRM to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Skipping Pages deploy (missing CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets)"
            exit 0
          fi
          npx --yes wrangler@4 pages deploy amaranthus-crm/site --project-name=amaranthus-app

      - name: Trigger live Worker sync
        env:
          SYNC_URL: ${{ secrets.AMARANTHUS_SYNC_URL }}
          SYNC_KEY: ${{ secrets.AMARANTHUS_SYNC_KEY }}
        run: |
          if [ -z "$SYNC_URL" ]; then
            echo "Skipping Worker sync (no AMARANTHUS_SYNC_URL)"
            exit 0
          fi
          if [ -n "$SYNC_KEY" ]; then
            curl -fsS -X POST "${SYNC_URL%/}/sync" -H "x-sync-key: $SYNC_KEY"
          else
            curl -fsS -X POST "${SYNC_URL%/}/sync"
          fi
